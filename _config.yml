# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Shengyi Qian
email: jasonsyqian@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Copyright © 2015 - 2020 @JasonQSY
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://jasonqsy.github.io" # the base hostname & protocol for your site, e.g. http://example.com
version: 2.0.2

# third-party accounts
github_username: JasonQSY
disqus:
    shortname: jasonqian

# Build settings
markdown: Kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-toc

global_css: '/static/website.css'
avatar: '/static/avatar.png'
cv: '/resources/syqian_cv.pdf'

