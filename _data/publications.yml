  image_style: 'margin-top: 10px; margin-bottom: 10px;'
  authors:
  - name: Shengyi Qian
    self: true
  - name: David Fouhey
    url: https://cs.nyu.edu/~fouhey/
  body:
  - kind: venue
    tag: div
    text: ICCV 2023
  - kind: description
    tag: p
    text: We detect potential 3D object interaction from a single image and a set of query points. Building on <a href="https://segment-anything.com/">Segment-Anything</a>, our model can predict whether the object is movable, rigid, and 3D locations, affordance, articulation, etc.
  - kind: links
    tag: div
    links:
    - label: project page
      url: https://jasonqsy.github.io/3DOI/
    - label: paper
      url: https://arxiv.org/abs/2305.09664
    - label: code
      url: https://github.com/JasonQSY/3DOI
    - label: video
      url: https://www.youtube.com/watch?v=YDIL93XxHyk
  - kind: links
    tag: p
    links:
    - label: OpenXLab demo (with gpu)
      url: https://openxlab.org.cn/apps/detail/JasonQSY/3DOI
    - label: HF demo (cpu)
      url: https://huggingface.co/spaces/shengyi-qian/3DOI
  - kind: extra
    tag: div
    text: The paper is also presented at <a href="https://sites.google.com/view/cvpr2023-3d-vision-robotics">CVPR 2023 Workshop on 3D Vision and Robotics</a>.
- title: 'Sound Localization from Motion: Jointly Learning Sound Direction and Camera Rotation.'
  image: /resources/SLfM.jpg
  image_style: 'margin-top: 20px; margin-bottom: 40px;'
  authors:
  - name: Ziyang Chen
    url: https://ificl.github.io/
  - name: Shengyi Qian
    self: true
  - name: Andrew Owens
    url: http://andrewowens.com/
  body:
  - kind: venue
    tag: div
    text: ICCV 2023
  - kind: description
    tag: p
    text: We jointly learn to localize sound sources from audio and to estimate camera rotations from images. Our method is entirely self-supervised.
  - kind: links
    tag: p
    links:
    - label: project page
      url: https://ificl.github.io/SLfM/
    - label: paper
      url: https://arxiv.org/abs/2303.11329
    - label: code
      url: https://github.com/IFICL/SLfM
    - label: bibtex
      url: https://ificl.github.io/SLfM/docs/bibtex.txt
