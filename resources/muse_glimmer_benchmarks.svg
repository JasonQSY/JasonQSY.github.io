<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title description">
  <title id="title">Muse Glimmer 30B benchmark performance</title>
  <desc id="description">Grouped horizontal bar chart comparing Muse Glimmer 30B, Gemma 4 31B, and Qwen 3.6 27B on six agentic, coding, and multimodal benchmarks.</desc>
  <rect width="1400" height="840" fill="#f8fbff"/>

